name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoapply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U autoapply -d autoapply_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
      PORT: "3001"
      DATABASE_URL: postgresql://autoapply:secret@localhost:5432/autoapply_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-min-32-chars-1234567890abcdef
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: 12345678901234567890123456789012
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o
      RESEND_API_KEY: ""
      FROM_EMAIL: AutoApply <noreply@autoapply.dev>
      UPLOADS_DIR: ./uploads
      MAX_FILE_SIZE_MB: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema apps/api/src/db/prisma/schema.prisma
      - run: npm test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

