<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background:#09090b;color:#f4f4f5;font-family:Arial,sans-serif;">
    <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
      <div style="background:#18181b;border:1px solid #27272a;border-radius:20px;padding:32px;">
        <div style="font-size:24px;font-weight:700;margin-bottom:12px;">Reset your AutoApply password</div>
        <p style="color:#d4d4d8;line-height:1.6;margin:0 0 16px;">Hi {{name}}, we received a request to reset your password.</p>
        <p style="color:#d4d4d8;line-height:1.6;margin:0 0 24px;">Use the button below to choose a new password. This link expires in {{expiresInMinutes}} minutes.</p>
        <a href="{{resetUrl}}" style="display:inline-block;background:linear-gradient(90deg,#6366f1,#8b5cf6);color:white;text-decoration:none;padding:14px 20px;border-radius:12px;font-weight:700;">Reset password</a>
        <p style="color:#a1a1aa;line-height:1.6;margin:24px 0 0;">If you did not request this, you can safely ignore this email.</p>
      </div>
    </div>
  </body>
</html>
